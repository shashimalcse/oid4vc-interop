# Baseline for oid4vp-1final-verifier-haip-test-plan (haip, x509_hash, request_uri_signed,
# sd_jwt_vc, direct_post.jwt). Observed 2026-10-13 against IS 7.4.0-SNAPSHOT super tenant with a
# CA-issued request-signing certificate (tools/install_request_cert.py) and identity-openid4vc 1.1.16
# plus the unreleased fix/sd-jwt-default-sd-alg and fix/vp-client-metadata-final branches (see
# vp-base.yaml). Numbers in brackets refer to the gap analysis.
#
# IS decrypts and verifies correctly (valid presentations VERIFIED, every negative module rejected
# for its own flaw). The only remaining HAIP gap is the missing redirect_uri.
profile: vp-haip
cases:
  "oid4vp-1final-verifier-*":
    expect: FAILED
    reason: "[VP-39] the direct_post response has no redirect_uri (HAIP 1.0 §5.1)"
    conditions:
      - VP1FinalEnsureDirectPostResponseHasRedirectUriForHaip
  oid4vp-1final-verifier-request-uri-method-post:
    expect: SKIPPED
    reason: "[VP-43] request_uri_method=post not offered (optional)"
