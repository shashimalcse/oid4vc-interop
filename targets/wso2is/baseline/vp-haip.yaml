# Baseline for oid4vp-1final-verifier-haip-test-plan (haip, x509_hash, request_uri_signed,
# sd_jwt_vc, direct_post.jwt). Observed 2026-10-12 against IS 7.4.0-SNAPSHOT (identity-openid4vc
# 1.1.16) configured for x509_hash + direct_post.jwt. Numbers in brackets refer to the gap analysis.
#
# The suite posts encrypted presentations and IS decrypts and verifies them. With the _sd_alg
# default fix (identity-openid4vc branch fix/sd-jwt-default-sd-alg, deployed 2026-10-12) valid
# presentations end VERIFIED and every negative module is rejected for its own flaw (VPV-60010
# KB-JWT signature, 60011 issuer, 60017 sd_hash, 60007 nonce, 60016 aud, 60021 iat). Modules still
# fail on the request-level gaps below; IS answers the POST with 200 {} (no redirect_uri).
profile: vp-haip
cases:
  "oid4vp-1final-verifier-*":
    expect: FAILED
    reason: >-
      [#11] self-signed request leaf; [#7] client_id_scheme sent; [#6] vp_formats instead of
      vp_formats_supported; [#5] encryption JWK has no alg; HAIP 5: no encrypted_response_enc_values_supported;
      [VP-39] direct_post response has no redirect_uri
    conditions:
      - ValidateRequestObjectSignatureAgainstX5cHeader
      - CheckNoClientIdSchemeParameter
      - VP1FinalValidateVpFormatsSupportedInClientMetadata
      - VP1FinalValidateClientMetadataJwksForEncryptedResponse
      - ValidateVpClientMetadataEncryptionForHaip
      - VP1FinalEnsureDirectPostResponseHasRedirectUriForHaip
  oid4vp-1final-verifier-request-uri-method-post:
    expect: SKIPPED
    reason: "[VP-43] request_uri_method=post not offered (optional)"
