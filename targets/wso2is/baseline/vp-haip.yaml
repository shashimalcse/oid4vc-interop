# Baseline for oid4vp-1final-verifier-haip-test-plan (haip, x509_hash, request_uri_signed,
# sd_jwt_vc, direct_post.jwt). Observed 2026-10-12 against IS 7.4.0-SNAPSHOT (identity-openid4vc
# 1.1.16) configured for x509_hash. Numbers in brackets refer to the gap analysis.
#
# IS sent response_mode=direct_post with no client_metadata.jwks, so the suite could not encrypt
# a response and never posted one: none of the presentation checks ran.
profile: vp-haip
cases:
  "oid4vp-1final-verifier-*":
    expect: FAILED
    reason: >-
      response_mode is direct_post, not direct_post.jwt, and client_metadata has no jwks or
      encrypted_response_enc_values_supported (HAIP 5); [#11] self-signed request leaf;
      [#7] client_id_scheme sent; [#6] vp_formats instead of vp_formats_supported
    conditions:
      - ValidateRequestObjectSignatureAgainstX5cHeader
      - ValidateResponseMode
      - CheckNoClientIdSchemeParameter
      - VP1FinalValidateVpFormatsSupportedInClientMetadata
      - VP1FinalCheckForKeyIdInClientMetadataJWKs
      - VP1FinalValidateClientMetadataJwksForEncryptedResponse
      - ValidateVpClientMetadataEncryptionForHaip
      - VP1FinalCheckEncryptionKeyNotReused
      - VP1FinalEncryptVPResponse
  oid4vp-1final-verifier-request-uri-method-post:
    expect: SKIPPED
    reason: "[VP-43] request_uri_method=post not offered (optional)"
