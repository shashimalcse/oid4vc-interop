# Real wallets presenting the vcit test PID to the IS verifier. Observed 2026-10-13
# (IS 7.4.0-SNAPSHOT super tenant, x509_hash + direct_post.jwt, identity-openid4vc 1.1.16 plus the
# unreleased fix/sd-jwt-default-sd-alg and fix/vp-client-metadata-final branches; walt.id Wallet2
# 1.1.1; EUDI openid4vp 0.16.2).
#
# The EUDI wallet presents end to end and IS verifies. Against stock 1.1.16 it refuses the request:
# client_metadata has the pre-final vp_formats instead of vp_formats_supported.
profile: wallet-vp
cases:
  waltid-wallet2/presentation.request:
    expect: FAILED
    reason: >-
      IS GET /oid4vp/requests/{id} answers 406 to Wallet2's Accept: application/json (the endpoint is
      @Produces("application/oauth-authz-req+jwt")). Not a spec violation on either side; IS should
      serve the request object regardless of Accept. The EUDI wallet fetches it fine.
