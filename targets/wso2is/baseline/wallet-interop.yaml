# Wallet2 issuance from IS, then presentation. Observed 2026-10-12 (IS 7.4.0-SNAPSHOT, Wallet2 1.1.1).
profile: wallet-interop
cases:
  waltid-wallet2/issuance.authorization-url:
    expect: FAILED
    reason: >-
      IS RFC 8414 metadata (/.well-known/oauth-authorization-server/...) advertises scopes_supported: []
      (its OIDC discovery lists real scopes, and neither lists the VC template scope); Wallet2 rejects
      an empty scopes_supported. Also no dpop_signing_alg_values_supported (gap #24).
