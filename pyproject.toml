[project]
name = "vcit"
version = "0.1.0"
description = "OpenID4VC conformance and wallet interop tests for any credential issuer and verifier"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2.6",
    "cryptography>=42",
    "jinja2>=3.1",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
vcit = "vcit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
